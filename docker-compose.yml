services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: outlet
      POSTGRES_USER: outlet
      POSTGRES_PASSWORD: outlet
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outlet -d outlet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
