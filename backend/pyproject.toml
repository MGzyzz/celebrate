[tool.poetry]
name = "outlet-backend"
version = "0.1.0"
description = "Django backend for Telegram Mini App graduation planner"
authors = ["Outlet Team"]
readme = "../README.md"
packages = [{ include = "apps" }, { include = "config" }]

[tool.poetry.dependencies]
python = "^3.11"
django = ">=5.2,<6.1"
djangorestframework = ">=3.15,<3.18"
django-cors-headers = ">=4.4,<5.0"
django-environ = ">=0.11,<0.13"
psycopg = { version = ">=3.2,<4.0", extras = ["binary"] }
gunicorn = ">=23.0,<24.0"
whitenoise = ">=6.7,<7.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
pytest-django = ">=4.9,<5.0"
ruff = ">=0.8,<0.14"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
